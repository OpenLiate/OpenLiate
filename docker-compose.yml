version: "3.8"

services:
  openliate-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openliate-runtime
    ports:
      - "7071:7071"
    environment:
      - PORT=7071
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - NEON_AI_GATEWAY_TOKEN=${NEON_AI_GATEWAY_TOKEN}
      - NEON_AI_GATEWAY_BASE_URL=${NEON_AI_GATEWAY_BASE_URL}
      - AGENTMAIL_API_KEY=${AGENTMAIL_API_KEY}
    restart: unless-stopped

